# Конфигурация Nginx для российского сервера (Ubuntu / Debian VPS в Timeweb Cloud / Selectel / Рег.ру)
# Домен: vozduh-nsk54.ru и www.vozduh-nsk54.ru
# Установка в /etc/nginx/sites-available/vozduh-nsk54.conf

server {
    listen 80;
    listen [::]:80;
    server_name vozduh-nsk54.ru www.vozduh-nsk54.ru;

    # Перенаправление всего трафика на защищённый протокол HTTPS
    return 301 https://vozduh-nsk54.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vozduh-nsk54.ru www.vozduh-nsk54.ru;

    # SSL-сертификаты Let's Encrypt (автоматически создаются командой certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/vozduh-nsk54.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vozduh-nsk54.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
